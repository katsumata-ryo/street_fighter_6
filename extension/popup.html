<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>SF6 Battlelog Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>SF6 Battlelog Sync</h1>

    <button id="sync" class="primary">バトルログを同期</button>
    <p id="status" class="status"></p>

    <details id="settings">
      <summary>設定</summary>
      <label for="endpoint">Apps Script の URL</label>
      <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" />

      <label for="token">合言葉</label>
      <input id="token" type="text" placeholder="Code.gs の TOKEN と同じ値" />

      <button id="save">保存</button>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
